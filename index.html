    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:  #18130e;
      --straw: #b89a58;
      --sage:  #7a8a62;
      --cream: #f2ece0;
    }

    body {
      font-family: 'Karla', sans-serif;
      background: var(--dark);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }

    .sparrow {
      width: 120px;
      height: 120px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: rise 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 10vw, 6.5rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
      line-height: 1;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    }

    .rule {
      width: 40px;
      height: 1px;
      background: var(--straw);
      margin: 0 auto 1.5rem;
      opacity: 0;
      animation: rise 0.8s ease 0.65s forwards;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      color: var(--straw);
      letter-spacing: 0.04em;
      line-height: 1.5;
      max-width: 440px;
      opacity: 0;
      animation: rise 0.8s ease 0.75s forwards;
    }

    .signup {
      margin-top: 3.5rem;
      opacity: 0;
      animation: rise 0.8s ease 1.1s forwards;
      width: 100%;
      max-width: 380px;
    }

    .signup-label {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1rem;
    }

    .signup-row {
      display: flex;
      border: 1px solid rgba(184,154,88,0.3);
    }

    .signup-row input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.75rem 1rem;
      font-family: 'Karla', sans-serif;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--cream);
      outline: none;
      min-width: 0;
    }

    .signup-row input::placeholder {
      color: rgba(242,236,224,0.25);
    }

    .signup-row button {
      background: transparent;
      border: none;
      border-left: 1px solid rgba(184,154,88,0.3);
      padding: 0.75rem 1.1rem;
      font-family: 'Karla', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--straw);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .signup-row button:hover {
      background: rgba(184,154,88,0.08);
    }

    footer {
      padding: 2.5rem 2rem;
      text-align: center;
      opacity: 0;
      animation: rise 0.8s ease 1.25s forwards;
    }

    .footer-location {
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(242,236,224,0.25);
      margin-bottom: 0.5rem;
    }

    .footer-contact a {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: rgba(184,154,88,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-contact a:hover {
      color: var(--straw);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      main { padding: 3rem 1.5rem; }
      .sparrow { width: 90px; height: 90px; }
    }
  </style>
</head>
